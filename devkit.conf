# shellcheck shell=bash
# StartDGX's settings for the devkit (scripts/devkit, a submodule; docs/testing.md): the test session and reload.
TOUR_PLUGIN_ID=io.github.bmaltais.startdgx
# qmllint with the Omarchy shell's modules on its import path (scripts/lint/qmllint), for the check and its pre-commit.
PATH=$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)/scripts/lint:$PATH
DEVKIT_NAME=startdgx
DEVKIT_LAYERS=(omarchy-startdgx)
DEVKIT_ENV=(STARTDGX_DEMO=1)               # the CLI serves the fixture machines in demo/ and runs no process at all
# A second wall: even if demo mode had a hole, nothing in the session can reach a real machine. The sandbox home has no ~/.ssh either.
DEVKIT_GUARD_EXTRA=(ssh scp sftp rsync ssh-copy-id tailscale)
TOUR_SANDBOX_COPY=()                       # nothing of the real config is copied in
# The sandbox has its own home, so the real hosts.json is never read there; this proves a recording kept it so.
TOUR_REAL_UNCHANGED=(.config/omarchy/shell.json .config/startdgx)
# demo/ ships with the plugin (the CLI's demo mode reads it); the Python byte cache does not.
DEVKIT_RELOAD_EXCLUDE=(__pycache__)

# A click in the session must not reach a real machine: the sandbox is put in demo mode by the marker file in its own home, and the
# session refuses to start without it.
devkit_sandbox() {
  local h=$1
  mkdir -p "$h/.config/startdgx/demo"; : >"$h/.config/startdgx/demo/ENABLED"
  [[ -f $h/.config/startdgx/demo/ENABLED ]] || { echo "the sandbox could not be put in demo mode" >&2; return 1; }
}

DEVKIT_USAGE='  dev open | add | uninstall HOST | forget HOST | models HOST | recipe HOST [PATH] | remove HOST MODEL | close   open the manager, its Add machine card, a machine'\''s uninstall or forget card, model picker or Add recipe card (with a path typed in), a model'\''s remove card, or close it'
dev_cmd_open() { nenv omarchy-shell -q "$ID" close 2>/dev/null || true; sleep 0.4; dev_window open "$ID" open; }
dev_cmd_add() { dev_window add "$ID" addMachine; }
dev_cmd_uninstall() { dev_window uninstall "$ID" uninstall "${1:?uninstall needs a host, e.g. demo@spark-a}"; }
dev_cmd_models() { dev_window models "$ID" addModel "${1:?models needs a host, e.g. demo@spark-a}"; }
dev_cmd_recipe() { dev_window recipe "$ID" addRecipe "${1:?recipe needs a host, e.g. demo@spark-a}" "${2:-}"; }
dev_cmd_remove() { dev_window remove "$ID" removeModel "${1:?remove needs a host and a model}" "${2:?remove needs a host and a model}"; }
dev_cmd_forget() { dev_window forget "$ID" forget "${1:?forget needs a host, e.g. demo@spark-a}"; }
dev_cmd_close() { nenv omarchy-shell "$ID" close >/dev/null; echo "dev close: closed"; }

# `reload` (the kit's, via scripts/reload): the service answers `state` once it is loaded, and a window is opened after that.
DEVKIT_RELOAD_READY=state
reload_open() {
  case $1 in
    open) omarchy-shell -q "$ID" close || true; sleep 0.4; omarchy-shell "$ID" open >/dev/null ;;
    add) omarchy-shell "$ID" addMachine >/dev/null ;;
    *) die "unknown window $1 (open | add)" ;;
  esac
}

# `check` (scripts/check.sh) runs these after its own steps.
# Icons in QML are private-use glyphs, and writing a file through a tool that drops them leaves an empty string where the icon was.
# An empty icon is never intended, so an empty `iconText` fails.
icons() {
  local hits
  hits=$(grep -nE 'iconText: *""' ./*.qml || true)
  [[ -z $hits ]] || { echo "empty iconText (an icon lost its glyph; write icons as \\uXXXX escapes):"; echo "$hits"; return 1; }
}
devkit_check() {
  step "CLI behaviour (tests/cli.sh)" tests/cli.sh
  step "manager rules (node --test tests/js/)" node --test tests/js/
  step "QML icons (no empty iconText)" icons
}
